name: Import project 1.4
on:
  push:
    paths:
      - project14.b64
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d project14.b64 > /tmp/project14.zip
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'project14.b64' -exec rm -rf -- {} +
          unzip -q -o /tmp/project14.zip -d .
          rm -f project14.b64
          rm -f .github/workflows/import-project.yml
      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: import project 1.4 [skip ci]'
          git push origin HEAD:main
